name: deps-monitor
# The external monitor for /deps (spec 28.15): Railway does not report a skipped or hung cron run, so the service's
# own pulse is read from outside every 30 minutes. A red run means degraded or unreachable; GitHub notifies the owner.
# Needs the repository secrets HERMES_DEPS_URL (https://<app>/deps) and HERMES_MONITOR_TOKEN; without them the run
# passes with a warning. The repository is public: the address stays a secret, never a value in this file. Until the
# owner sets them, the Railway cron service deps-watch runs the same check from inside (spec 28.34). Reads nothing from the repository but the script; no write permission.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deps-monitor, cancel-in-progress: false }
jobs:
  deps:
    runs-on: ubuntu-24.04   # pinned: the image changes only by a deliberate, tested edit
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24)
      - run: python3 ops/monitor/check_deps.py
        env:
          HERMES_DEPS_URL: ${{ secrets.HERMES_DEPS_URL }}
          HERMES_MONITOR_TOKEN: ${{ secrets.HERMES_MONITOR_TOKEN }}
