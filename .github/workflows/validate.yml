name: validate
on: [push, pull_request]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (ADR-0008); tools/check_supply_chain.py reports unpinned ones.
# Branch protection requires ONE status check: `gate` (below). It fails unless every required job ran and
# succeeded on this commit; skipped, cancelled or failed jobs never turn into an acceptance (review of 1.7, §4).
jobs:
  contracts-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-ci.txt
      - run: pip-audit -r requirements-ci.txt --strict   # fails on any known vulnerability
      - run: python tools/validate.py
      - run: python tools/derive.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_evals.py
      - run: python tools/check_supply_chain.py
      - run: python tools/check_claims.py
      - run: python tools/check_spec.py --check        # counts, inventories and generated sections of the specification
      - run: python tools/build_manifest.py --check   # files and reports belong to the declared version
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: bash db/tests/run_isolation.sh        # migrations as a PLAIN owner + all isolation and catalog cases
      - run: bash db/tests/concurrency_reserve.sh  # two sessions race for the last headroom (R1)
      - run: bash db/tests/concurrency_outbox.sh   # two deliveries of one approved effect: one row, same id
      - run: bash db/tests/concurrency_lease.sh    # lease expiry and recovery inside a running transaction
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-service.txt   # the Postgres driver, hashed lock
      # P1 end to end: service.app over HTTP (webhook -> routed task -> worker -> owner approval -> outbox -> dispatch -> receipt)
      - run: python db/tests/e2e_pilot.py
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
  workflow-guard:
    # A change to ANY gate path (checkers, policies, claims, inventories, tests of the database, CI) is judged
    # by the checkers of the BASE commit, run on the change's data. The guard program itself comes from base.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }
      # the base checkers run in the same environment as contracts-and-policy; the system Python's old jsonschema
      # cannot resolve the contract schema's $ref and crashed the base validator (first CI runs)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$base:tools/gate_guard.py" 2>/dev/null; then
            echo "no usable base commit with a gate guard: the full job set below still has to pass"; exit 0
          fi
          # dependencies from BASE too: a change cannot swap the tools that judge it
          if git show "$base:requirements-ci.txt" > "$RUNNER_TEMP/requirements-ci.txt" 2>/dev/null; then
            pip install -r "$RUNNER_TEMP/requirements-ci.txt"
          fi
          git show "$base:tools/gate_guard.py" > "$RUNNER_TEMP/gate_guard.py"
          python3 "$RUNNER_TEMP/gate_guard.py" --base "$base"
  release-gate:
    # Tags that may reach production: supply-chain warnings become failures (ADR-0008), every "must" claim needs a
    # test or a declared decision, and the database job must have run every case on a real Postgres.
    needs: [contracts-and-policy, database, workflow-guard]
    # This job cannot verify its own pins. Its `uses:` lines are pinned by hand once (docs/setup_guide.md,
    # step 1) and protected by CODEOWNERS + branch protection: DO NOT edit without re-pinning to a full SHA.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: python3 tools/check_supply_chain.py --strict
      - run: python3 tools/check_claims.py --release     # every "must" claim has a test, or a declared decision
  gate:
    # The ONLY required status check. `if: always()` so that it runs, and FAILS, when a needed job failed, was
    # cancelled or was skipped; a skipped job is never read as a success.
    if: always()
    needs: [contracts-and-policy, database, workflow-guard, release-gate]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          r = {k: v["result"] for k, v in json.loads(os.environ["RESULTS"]).items()}
          must = ["contracts-and-policy", "database", "workflow-guard"]
          bad = [f"{k}={r.get(k)}" for k in must if r.get(k) != "success"]
          rel = r.get("release-gate")
          if os.environ["IS_TAG"] == "true" and rel != "success":
              bad.append(f"release-gate={rel}")
          if os.environ["IS_TAG"] != "true" and rel not in ("skipped", "success"):
              bad.append(f"release-gate={rel}")
          print("tested", os.environ["TESTED_SHA"], "for head", os.environ["HEAD_SHA"], "->", r)
          if bad:
              sys.exit("gate: not accepted: " + ", ".join(bad))
          print("gate: every required job ran and succeeded")
          PY
